[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-server-monitor"
version = "0.1.5"
description = "System metrics collector for CPU, memory, disk, and network"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
dependencies = ["psutil>=5.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-server-monitor#readme"
Repository = "https://github.com/philiprehberger/py-server-monitor"
Issues = "https://github.com/philiprehberger/py-server-monitor/issues"
Changelog = "https://github.com/philiprehberger/py-server-monitor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_server_monitor"]
